[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"
VITE_GOOGLE_CLIENT_ID = "449674501282-aq006m72jq75iekllfdnqc96oguvm1ai.apps.googleusercontent.com"
VITE_API_URL = "https://api.essentialke.co.ke/api"
VITE_ASSET_URL = "https://api.essentialke.co.ke"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
